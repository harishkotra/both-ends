name: BothEndsDemo
options:
  bundleIdPrefix: sh.bothends
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  BothEndsDemo:
    type: application
    platform: iOS
    sources:
      - path: BothEndsDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.bothends.demo
        PRODUCT_NAME: BothEndsDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Both Ends
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEVELOPMENT_TEAM: ""
schemes:
  BothEndsDemo:
    build:
      targets:
        BothEndsDemo: all
    run:
      config: Debug
